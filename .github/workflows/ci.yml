name: CI

# Every branch, deliberately. Pinning this to `main` meant it never ran at
# all — the repository's default branch is `master`, so eight pushes produced
# zero runs and the "CI is green" claim was never checkable.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Open Room targets Windows and macOS, and cross-platform breakage is both
    # the most likely regression here and the least likely to be caught locally.
    # Both runners are required from the first commit for that reason.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
