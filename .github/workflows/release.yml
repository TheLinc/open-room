name: Release

# Builds the installers from a version tag and attaches them to a GitHub
# release. Nothing is signed or notarized (no certificates yet — see the
# Packaging section of CLAUDE.md), so users get the usual unsigned-app
# warnings; the README documents the bypasses.
#
# Tag `v0.1.0` → `open-room-0.1.0-setup.exe` and `open-room-0.1.0.dmg`.
# The tag must match package.json's version; the check below refuses to
# ship an installer whose embedded version disagrees with its release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: dist/*-setup.exe
          - os: macos-latest
            script: build:mac
            artifact: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Same gate as CI: a tag must not ship what a push would have failed.
      - name: Typecheck, lint, test
        run: npm run typecheck && npm run lint && npm test

      # `--publish never` is required, not belt-and-braces: on a tag build
      # electron-builder reads GITHUB_REF_TYPE/GITHUB_REF_NAME, switches its
      # publish policy on, infers a GitHub target from the git remote (no
      # `publish` config needed), and fails wanting GH_TOKEN. The release job
      # below is what uploads; electron-builder only packages.
      - name: Package
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # electron-builder tries to sign when it finds credentials in the
          # environment; keep the no-signing decision explicit either way.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          # Drafted rather than published, so release notes are written by a
          # person before anyone is notified.
          draft: true
          generate_release_notes: true
