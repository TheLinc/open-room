name: Feature request
description: Something Open Room should do that it does not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the "Settled decisions" and "Open questions" sections of CONTRIBUTING.md. Some things are deliberately out — cloud TTS, API keys, automatic conversation resets — and a request to add one will be closed with a pointer there.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. "I run four agents and cannot tell which one is asking me something" beats "add a sound per agent".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agents and conversations
        - Voice output (TTS, SpeechBus)
        - Voice input (push-to-talk, wake words)
        - Overlay / HUD / notifications
        - Permissions and tools
        - Packaging and install
        - Something else
