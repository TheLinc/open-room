# Reverse-DNS of the domain the project owns, openroom.dev.
#
# On Windows this is also the AppUserModelID that the NSIS installer stamps
# into the Start Menu shortcut, and a toast is only attributed to the app when
# the AUMID the running process sets matches it. So this has to stay in step
# with `setAppUserModelId` in src/main/index.ts — notifications are how agents
# report back by default, and a mismatch silences them with no error anywhere.
appId: dev.openroom.app
productName: Open Room
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Everything that must be a real file on disk rather than a member of the
# asar: native modules, and the SDK's own claude binary, which the SDK spawns
# and no archive can execute. electron-builder unpacks most of these on its
# own by detecting .node files; listing them keeps that from depending on a
# heuristic, and the SDK binary is a plain executable the heuristic can miss.
asarUnpack:
  - resources/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/onnxruntime-node/**
  - node_modules/@img/**
win:
  executableName: open-room
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # The only permission the app asks for. The listening overlay owns the
    # microphone; nothing touches the camera or the user's folders.
    - NSMicrophoneUsageDescription: Open Room listens for push-to-talk and wake words when voice input is enabled.
  # Unsigned and unnotarized for now — no Apple Developer account. The README
  # carries the Gatekeeper bypass. Reversible whenever signing is set up.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
# No auto-update. The scaffold pointed `publish` at a placeholder URL, which
# electron-builder would otherwise bake into the app as an update feed.
npmRebuild: false
