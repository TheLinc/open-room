<!doctype html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      The overlay loads no remote anything. Its own bundle and inline styles
      are the whole surface.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Open Room overlay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/overlay-main.tsx"></script>
  </body>
</html>
